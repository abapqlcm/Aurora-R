name: Build Aurora-R APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIهایی که ساخته شوند"
        required: false
        default: "arm64-v8a"

env:
  AETHER_TAG: v1.8.0
  NDK_VERSION: r26d

jobs:
  # ------------------------------------------------------------------ 1
  # کراس‌کامپایل libaether.so (هسته Rust) برای اندروید
  build-aether:
    name: libaether.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi

    steps:
      - name: Checkout Aether ${{ env.AETHER_TAG }}
        uses: actions/checkout@v4
        with:
          repository: CluvexStudio/Aether
          ref: ${{ env.AETHER_TAG }}
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go (needed by BoringSSL in quiche)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          local-cache: false

      - name: Cache cargo (downloads only, not build artifacts)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: aether-registry-${{ env.AETHER_TAG }}-${{ hashFiles('aether/Cargo.lock') }}
          restore-keys: |
            aether-registry-${{ env.AETHER_TAG }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libaether.so
        working-directory: aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t ${{ matrix.abi }} --platform 24 build --release --lib
          echo "--- خروجی ---"
          find target -name "libaether.so" -exec ls -lh {} \;

      - name: Verify exported symbols
        working-directory: aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          SO=$(find target -name libaether.so | head -1)
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          echo "بررسی توابع C API در $SO"
          for fn in aether_version aether_identity_open aether_scan_start \
                    aether_tunnel_start aether_job_poll aether_string_free; do
            if "$NM" -D --defined-only "$SO" 2>/dev/null | grep -q " $fn$"; then
              echo "  OK   $fn"
            else
              echo "  FAIL $fn غایب است"
              exit 1
            fi
          done

      - name: Upload libaether.so
        uses: actions/upload-artifact@v4
        with:
          name: libaether-${{ matrix.abi }}
          path: aether/target/**/libaether.so
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ 2
  # بیلد libhev-socks5-tunnel.so (tun2socks برای حالت TUN)
  build-tun2socks:
    name: libhev-socks5-tunnel.so
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hev-socks5-tunnel
        uses: actions/checkout@v4
        with:
          repository: heiher/hev-socks5-tunnel
          submodules: recursive
          fetch-depth: 1

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          local-cache: false

      - name: Build with ndk-build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            APP_ABI="arm64-v8a armeabi-v7a" \
            APP_PLATFORM=android-24 \
            APP_OPTIM=release
          echo "--- خروجی ---"
          find libs -name "*.so" -exec ls -lh {} \;

      - name: Upload tun2socks libs
        uses: actions/upload-artifact@v4
        with:
          name: libhev-socks5-tunnel
          path: libs/**/libhev-socks5-tunnel.so
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------ 3
  # ساخت APK نهایی
  build-apk:
    name: Aurora-R APK
    needs: [build-aether, build-tun2socks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aurora-R
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate signing keystore
        run: |
          # کلید امضای پایدار برای استفاده شخصی (Aurora-R).
          # اگر سیکرت‌های AURORA_* در ریپو تعریف شده باشند از آن‌ها استفاده می‌شود،
          # وگرنه یک کلید ثابت با گذرواژه‌ی مشخص ساخته می‌شود تا APK قابل نصب باشد.
          KS_PASS="${{ secrets.AURORA_KS_PASS }}"
          if [ -z "$KS_PASS" ]; then KS_PASS="aurora-r-personal"; fi
          KEY_ALIAS="${{ secrets.AURORA_KEY_ALIAS }}"
          if [ -z "$KEY_ALIAS" ]; then KEY_ALIAS="aurora"; fi
          KEY_PASS="${{ secrets.AURORA_KEY_PASS }}"
          if [ -z "$KEY_PASS" ]; then KEY_PASS="$KS_PASS"; fi

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/aurora.jks" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Aurora-R, OU=iprez, O=Aurora, C=IR"

          echo "AURORA_KEYSTORE=$RUNNER_TEMP/aurora.jks" >> "$GITHUB_ENV"
          echo "AURORA_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "AURORA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AURORA_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts

      - name: Place native libs into jniLibs
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a

          echo "=== libaether.so ==="
          # cargo-ndk خروجی را زیر target/<rust-target>/release می‌گذارد
          find native-artifacts/libaether-arm64-v8a -name libaether.so -exec \
            cp -v {} app/src/main/jniLibs/arm64-v8a/ \;
          find native-artifacts/libaether-armeabi-v7a -name libaether.so -exec \
            cp -v {} app/src/main/jniLibs/armeabi-v7a/ \;

          echo "=== libhev-socks5-tunnel.so ==="
          cp -v native-artifacts/libhev-socks5-tunnel/arm64-v8a/libhev-socks5-tunnel.so \
                app/src/main/jniLibs/arm64-v8a/
          cp -v native-artifacts/libhev-socks5-tunnel/armeabi-v7a/libhev-socks5-tunnel.so \
                app/src/main/jniLibs/armeabi-v7a/

          echo "=== نتیجه ==="
          ls -lhR app/src/main/jniLibs/

      - name: Build release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK is signed
        run: |
          set -e
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --verbose "$APK"
          echo "امضا تأیید شد ✅"

      - name: Rename APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} out/ \;
          cd out && for f in *.apk; do
            mv "$f" "Aurora-R-${GITHUB_SHA::7}.apk" 2>/dev/null || true
          done
          ls -lh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-R-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
